<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Layout</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-item">Item One</div>
        <div class="sidebar-item">Item Two</div>
        <div class="sidebar-item">Item Three</div>
        <div class="sidebar-item">Item Four</div>
        <div class="sidebar-item">Item Five</div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Search Bar -->
        <div class="search-bar">
            <input type="text" placeholder="Search..." class="search-input">
            <div>Your face</div>
        </div>

        <!-- Welcome Section -->
        <div class="welcome-section">
            <h2>Hello User</h2>
            <div style="text-align: right;">Recent Items</div>
        </div>

        <!-- Card Grid -->
        <div class="card-grid">
            <div class="card">
                <div>Overview</div>
                <div>Card</div>
            </div>
            <div class="card">
                <div>Overview</div>
                <div>Card</div>
            </div>
            <div class="card">
                <div>Overview</div>
                <div>Card</div>
            </div>
            <div class="card">
                <div>Overview</div>
                <div>Card</div>
            </div>
        </div>

        <!-- Large Cards Grid -->
        <div class="large-cards-grid">
            <div class="large-card">Card</div>
            <div class="large-card">
                <div class="half-card">Card</div>
                <div class="half-card">Card</div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <div class="footer-text">© 2024 UK</div>
            <div class="footer-text">Made with love by pure genius</div>
        </div>
    </div>
</body>
</html>
